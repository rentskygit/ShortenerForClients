<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCM Realty Group - Submit Documents</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F7F5F0;
            --text-color: #1A1A1A;
            --accent-color: #374fa7; 
            --accent-hover: #374fa7; 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
            background-color: #FFFFFF;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .logo {
            width: 180px;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            margin-bottom: 15px;
            color: var(--text-color);
        }

        p {
            font-size: 15px;
            color: #555;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            border-radius: 8px;
            transition: all 0.3s ease;
            border: 2px solid var(--accent-color);
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #FFFFFF;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            border-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--accent-color);
        }

        .btn-secondary:hover {
            background-color: var(--accent-color);
            color: #FFFFFF;
            transform: translateY(-2px);
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            font-size: 14px;
            color: #888;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: var(--text-color);
        }
    </style>
</head>
<body>

    <div class="container">
         <img src="Logo_JcmRealtyGroup_Vertical.jpeg" alt="JCM Realty Group Logo" class="logo">
        
        <h1>Submit Supporting Documents</h1>
        <p>Please send your supporting documents to complete your application. You can contact us via email, text message, or check your credit report directly on Experian.</p>
        
        <a href="mailto:jcmrealty201@gmail.com?subject=Supporting%20Documents%20-%20JCM%20Realty" class="btn btn-primary">
            📧 Send via Email
        </a>
        
        <a href="sms:+17816704893" class="btn btn-secondary">
            💬 Send via Text Message
        </a>
        
        <a href="https://www.experian.com" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">
            🌐 Visit Experian.com
        </a>

        <a href="index.html" class="back-link">&larr; Back to Home</a>
    </div>

</body>
</html>
